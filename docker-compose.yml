# Local data lake: an S3-compatible object store (SeaweedFS) with one bucket per layer,
# and the dashboard that reads it (http://localhost:8501).
#
#   docker compose up -d          start both (lake data persists in a named volume)
#   docker compose down           stop it, keep the data
#   docker compose down -v        stop it and DELETE all lake data
#
# Credentials come from .env (see .env.example). The app talks to it through the
# standard S3 API, so switching to AWS S3 later is a configuration change.

name: hmis-dq

x-s3-credentials: &s3-credentials
  S3_ACCESS_KEY: ${HMIS_S3_ACCESS_KEY:?set HMIS_S3_ACCESS_KEY in .env}
  S3_SECRET_KEY: ${HMIS_S3_SECRET_KEY:?set HMIS_S3_SECRET_KEY in .env}

services:
  lake:
    image: chrislusf/seaweedfs:4.48
    container_name: hmis-lake
    environment: *s3-credentials
    # Write the S3 identity file from the environment (so no secret is committed),
    # then run master + volume + filer + S3 gateway in a single process.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<EOF
        {"identities": [{"name": "hmis", "credentials": [{"accessKey": "$$S3_ACCESS_KEY",
          "secretKey": "$$S3_SECRET_KEY"}], "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
        EOF
        exec weed server -dir=/data -ip.bind=0.0.0.0 -volume.max=0 \
          -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    # Host ports are configurable: Windows (Hyper-V/WSL) reserves blocks of ports
    # that change after reboots. If one is taken, set another in .env.
    # (Changing the S3 port also means updating HMIS_S3_ENDPOINT_URL.)
    ports:
      - "127.0.0.1:${HMIS_S3_PORT:-8333}:8333" # S3 API
      - "127.0.0.1:${HMIS_FILER_PORT:-18888}:8888" # file browser (filer UI)
      - "127.0.0.1:${HMIS_MASTER_PORT:-19333}:9333" # cluster status (master UI)
    volumes:
      - lake-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # One-shot job: create the lake buckets (safe to re-run).
  lake-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      lake:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for bucket in bronze silver gold; do
          echo "s3.bucket.create -name $$bucket" | weed shell -master=lake:9333 -filer=lake:8888
        done
        echo "s3.bucket.list" | weed shell -master=lake:9333 -filer=lake:8888
    restart: "no"

  # The dashboard, reading the lake. Built the first time `docker compose up -d` runs;
  # after code changes: docker compose up -d --build dashboard
  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    image: hmis-dq-dashboard:dev
    container_name: hmis-dashboard
    env_file: .env
    environment:
      # inside the compose network the lake is reached by its service name
      HMIS_S3_ENDPOINT_URL: http://lake:8333
    depends_on:
      lake:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HMIS_DASHBOARD_PORT:-8501}:8501"
    restart: unless-stopped

  # Apache NiFi: scheduled ingestion DHIS2 -> bronze, as a visual, monitored flow.
  # Not started (or downloaded: the image is about 1.1 GB) by a plain `up`; run
  #   docker compose --profile nifi up -d        then https://localhost:18443/nifi
  nifi:
    image: apache/nifi:2.12.0
    container_name: hmis-nifi
    profiles: ["nifi"]
    environment:
      # one login, from .env (NiFi 2 always runs on HTTPS with a login). Not marked
      # required here: compose reads every service, and the lake must start without it.
      SINGLE_USER_CREDENTIALS_USERNAME: ${HMIS_NIFI_USERNAME:-hmis}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${HMIS_NIFI_PASSWORD:-}
      NIFI_WEB_HTTPS_PORT: "8443"
      # NiFi rejects requests for host names it doesn't know: allow the published port
      NIFI_WEB_PROXY_HOST: "localhost:${HMIS_NIFI_PORT:-18443},127.0.0.1:${HMIS_NIFI_PORT:-18443}"
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 1g
    volumes:
      # our Python processors (NiFi 2 loads them from this folder)
      - ./nifi/python_extensions:/opt/nifi/nifi-current/python_extensions:ro
      # the flow, its state and any queued data survive restarts
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-state:/opt/nifi/nifi-current/state
      - nifi-flowfiles:/opt/nifi/nifi-current/flowfile_repository
      - nifi-content:/opt/nifi/nifi-current/content_repository
      - nifi-provenance:/opt/nifi/nifi-current/provenance_repository
    depends_on:
      lake:
        condition: service_healthy
    ports:
      # not 8443: Windows (Hyper-V/WSL) often reserves the range around it
      - "127.0.0.1:${HMIS_NIFI_PORT:-18443}:8443"
    restart: unless-stopped

  # Spark job runner. Not started by `up`; run jobs on demand:
  #   docker compose run --rm --service-ports spark hmis-dq spark smoke
  spark:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
      target: runtime
    image: hmis-dq-spark:dev
    profiles: ["jobs"]
    env_file: .env
    environment:
      # inside the compose network the lake is reached by its service name
      HMIS_S3_ENDPOINT_URL: http://lake:8333
    depends_on:
      lake:
        condition: service_healthy
    ports:
      - "127.0.0.1:4040:4040" # Spark UI while a job runs

  # Spark unit tests in Linux, using your current code (mounted, no rebuild needed):
  #   docker compose run --rm spark-test
  spark-test:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
      target: test
    image: hmis-dq-spark:test
    profiles: ["jobs"]
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro

volumes:
  lake-data:
  nifi-conf:
  nifi-state:
  nifi-flowfiles:
  nifi-content:
  nifi-provenance:
