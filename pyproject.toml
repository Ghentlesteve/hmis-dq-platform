[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hmis-dq"
version = "0.1.0"
description = "HMIS data quality and early-warning platform built on DHIS2, PySpark and Kubernetes."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kwenev Stephen" }]
license = { text = "MIT" }
dependencies = [
    "boto3>=1.35",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "rich>=13.7",
    "tenacity>=9.0",
    "typer>=0.12",
]

[project.scripts]
hmis-dq = "hmis_dq.cli:app"

[project.optional-dependencies]
spark = [
    "pyspark==4.1.3",  # must match the version in docker/spark.Dockerfile
]
explore = [
    "duckdb>=1.5",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "ipykernel>=6.29",
]
ml = [
    "hmis-dq[explore]",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
]
dashboard = [
    # listed directly (not via explore) so the dashboard image skips Jupyter/matplotlib
    "duckdb>=1.5",
    "pandas>=2.2",
    "streamlit>=1.50",
    "plotly>=6.0",
]
dev = [
    "hmis-dq[spark,explore,ml,dashboard]",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "boto3-stubs[s3]>=1.35",
    "moto[s3]>=5.0",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hmis_dq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the local lake running (docker compose up -d)",
    "spark: needs a working local Spark (always works in `docker compose run --rm spark-test`)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
# Typer maps each function parameter to a CLI option
"src/hmis_dq/cli.py" = ["PLR0917"]
# `from pyspark.sql import functions as F` is the standard PySpark convention
"src/hmis_dq/spark/**" = ["N812"]
"tests/spark/**" = ["N812"]
# NiFi Python processors: NiFi's API names (getPropertyDescriptors) and its
# convention of plain lists for `implements` and `tags`
"nifi/**" = ["N802", "RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
# these libraries ship without type information
module = ["sklearn.*", "statsmodels.*", "plotly.*"]
ignore_missing_imports = true
