# One-shot: create the three buckets (safe to re-run). A Job retries until it
# succeeds, so it simply waits out the lake's start-up.

apiVersion: batch/v1
kind: Job
metadata:
  name: lake-init
  labels:
    app.kubernetes.io/name: lake-init
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600 # tidy up an hour after success
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lake-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-buckets
          image: chrislusf/seaweedfs:4.48
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              for bucket in bronze silver gold; do
                echo "s3.bucket.create -name $bucket" | weed shell -master=lake:9333 -filer=lake:8888
              done
              echo "s3.bucket.list" | weed shell -master=lake:9333 -filer=lake:8888 | grep -q gold
