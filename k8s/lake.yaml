# The lake: SeaweedFS with an S3 API, as in docker-compose.yml.
# A StatefulSet, because it keeps data: a stable name, and a disk (PersistentVolume)
# that outlives the pod. Other pods reach it at http://lake:8333.

apiVersion: v1
kind: Service
metadata:
  name: lake
  labels:
    app.kubernetes.io/name: lake
spec:
  selector:
    app.kubernetes.io/name: lake
  ports:
    - { name: s3, port: 8333 }
    - { name: filer, port: 8888 }
    - { name: filer-grpc, port: 18888 } # weed shell (lake-init) talks gRPC
    - { name: master, port: 9333 }
    - { name: master-grpc, port: 19333 }
---
# The S3 API on the host too (http://localhost:18333), e.g. to seed the lake
# with `hmis-dq lake mirror`. Docker Desktop publishes LoadBalancer ports on localhost.
apiVersion: v1
kind: Service
metadata:
  name: lake-external
  labels:
    app.kubernetes.io/name: lake
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: lake
  ports:
    - { name: s3, port: 18333, targetPort: 8333 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lake
  labels:
    app.kubernetes.io/name: lake
spec:
  serviceName: lake
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lake
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lake
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          imagePullPolicy: IfNotPresent # already in the local image store
          env:
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: hmis-env, key: HMIS_S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: hmis-env, key: HMIS_S3_SECRET_KEY } }
          command: ["/bin/sh", "-c"]
          # same start-up as docker-compose.yml: write the S3 identity from the
          # Secret, then run master + volume + filer + S3 gateway in one process
          args:
            - |
              mkdir -p /etc/seaweedfs
              cat > /etc/seaweedfs/s3.json <<EOF
              {"identities": [{"name": "hmis", "credentials": [{"accessKey": "$S3_ACCESS_KEY",
                "secretKey": "$S3_SECRET_KEY"}], "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
              EOF
              exec weed server -dir=/data -ip.bind=0.0.0.0 \
                -volume.max=0 -master.volumeSizeLimitMB=1024 \
                -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          ports:
            - { containerPort: 8333, name: s3 }
            - { containerPort: 8888, name: filer }
            - { containerPort: 9333, name: master }
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  wget -q -O /dev/null http://127.0.0.1:9333/cluster/status &&
                  wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
